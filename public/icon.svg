<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Radial Gradient with Rich Midnight Slate -->
    <radialGradient id="bgGrad" cx="50%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#1e222d"/>
      <stop offset="50%" stop-color="#12151c"/>
      <stop offset="100%" stop-color="#08090d"/>
    </radialGradient>

    <!-- Luxury Multi-Stop 24k Gold Bezel Gradient -->
    <linearGradient id="goldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="15%" stop-color="#fde047"/>
      <stop offset="32%" stop-color="#d97706"/>
      <stop offset="48%" stop-color="#fffbeb"/>
      <stop offset="65%" stop-color="#f59e0b"/>
      <stop offset="85%" stop-color="#92400e"/>
      <stop offset="100%" stop-color="#fef08a"/>
    </linearGradient>

    <!-- Deep Metallic Gold Plate -->
    <radialGradient id="goldPlate" cx="42%" cy="28%" r="72%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="22%" stop-color="#facc15"/>
      <stop offset="52%" stop-color="#ca8a04"/>
      <stop offset="82%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#451a03"/>
    </radialGradient>

    <!-- Ultra-Luminous High-Vibrance Neon Steam Gradient -->
    <linearGradient id="luminousSteamGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.95"/>
      <stop offset="30%" stop-color="#38bdf8"/>
      <stop offset="60%" stop-color="#e0e7ff"/>
      <stop offset="85%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>

    <!-- Glowing Cyber Steam Underlay Gradient -->
    <linearGradient id="steamGlowGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0891b2"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <!-- Electric Neon Cup Outline Gradient -->
    <linearGradient id="neonCupGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="25%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#e0f2fe"/>
      <stop offset="75%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <linearGradient id="cyberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="45%" stop-color="#06b6d4"/>
      <stop offset="80%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <!-- Warm Amber Glow -->
    <radialGradient id="warmAmberGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>

    <!-- Drop Shadow Filters -->
    <filter id="tileShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#000000" flood-opacity="0.6"/>
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.35"/>
    </filter>

    <!-- High-Intensity Luminous Steam Halo Filter -->
    <filter id="steamSuperGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="7" result="wideBlur"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="sharpBlur"/>
      <feMerge>
        <feMergeNode in="wideBlur"/>
        <feMergeNode in="sharpBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Neon Cup Outline Glow Filter -->
    <filter id="neonCupGlowFilter" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="5.5" result="neonBlur"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.8" result="coreBlur"/>
      <feMerge>
        <feMergeNode in="neonBlur"/>
        <feMergeNode in="coreBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glowFilter" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      @keyframes steamRiseLeft {
        0% { transform: translate(0, 0) scale(0.98); opacity: 0.7; }
        50% { transform: translate(-5px, -14px) scale(1.12); opacity: 1; }
        100% { transform: translate(-10px, -28px) scale(1.22); opacity: 0.55; }
      }
      @keyframes steamRiseCenter {
        0% { transform: translate(0, 0) scale(0.98); opacity: 0.75; }
        50% { transform: translate(2px, -18px) scale(1.15); opacity: 1; }
        100% { transform: translate(4px, -34px) scale(1.28); opacity: 0.5; }
      }
      @keyframes steamRiseRight {
        0% { transform: translate(0, 0) scale(0.98); opacity: 0.7; }
        50% { transform: translate(6px, -13px) scale(1.1); opacity: 1; }
        100% { transform: translate(11px, -26px) scale(1.2); opacity: 0.6; }
      }
      @keyframes steamPulseLight {
        0%, 100% { opacity: 0.7; }
        50% { opacity: 1; filter: drop-shadow(0 0 12px #38bdf8); }
      }
      @keyframes neonCupFlicker {
        0%, 100% { 
          opacity: 1; 
          filter: drop-shadow(0 0 8px #00f0ff) drop-shadow(0 0 16px #06b6d4); 
        }
        8% { opacity: 0.95; }
        9% { opacity: 0.25; filter: drop-shadow(0 0 2px #00f0ff); }
        11% { opacity: 1; filter: drop-shadow(0 0 10px #00f0ff) drop-shadow(0 0 18px #06b6d4); }
        13% { opacity: 0.35; }
        15% { opacity: 1; }
        48% { opacity: 0.95; }
        49% { opacity: 0.4; }
        51% { opacity: 1; filter: drop-shadow(0 0 12px #00f0ff) drop-shadow(0 0 22px #38bdf8); }
        70% { opacity: 0.9; }
        72% { opacity: 1; }
        88% { opacity: 0.95; }
        89% { opacity: 0.3; }
        91% { opacity: 1; }
      }
      @keyframes cursorBlink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.15; }
      }
      @keyframes ambientPulse {
        0%, 100% { opacity: 0.45; transform: scale(1); }
        50% { opacity: 0.85; transform: scale(1.08); }
      }
      .steam-left {
        animation: steamRiseLeft 3.2s ease-in-out infinite alternate;
        transform-origin: -44px -74px;
      }
      .steam-center {
        animation: steamRiseCenter 2.6s ease-in-out infinite 0.4s alternate;
        transform-origin: 0px -130px;
      }
      .steam-right {
        animation: steamRiseRight 3.0s ease-in-out infinite 0.8s alternate;
        transform-origin: 44px -74px;
      }
      .steam-pulse {
        animation: steamPulseLight 2s ease-in-out infinite;
      }
      .neon-cup-blink {
        animation: neonCupFlicker 3.8s ease-in-out infinite;
      }
      .cursor-blink {
        animation: cursorBlink 1.1s step-end infinite;
      }
      .ambient-glow {
        animation: ambientPulse 3.5s ease-in-out infinite;
        transform-origin: 256px 225px;
      }
    </style>
  </defs>

  <!-- ============================================== -->
  <!-- 1. BASE SQUIRCLE TILE                          -->
  <!-- ============================================== -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" filter="url(#tileShadow)"/>
  
  <!-- Outer Gold Micro-Bevel Border -->
  <rect x="18" y="18" width="476" height="476" rx="106" fill="none" stroke="url(#goldRim)" stroke-width="3.5" opacity="0.9"/>
  <rect x="26" y="26" width="460" height="460" rx="98" fill="none" stroke="#252a36" stroke-width="1.5" opacity="0.6"/>

  <!-- Subtle Cyber Corner Accent Marks -->
  <path d="M 48 76 L 48 48 L 76 48" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" opacity="0.75"/>
  <path d="M 464 76 L 464 48 L 436 48" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" opacity="0.75"/>
  <path d="M 48 436 L 48 464 L 76 464" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" opacity="0.75"/>
  <path d="M 464 436 L 464 464 L 436 464" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" opacity="0.75"/>

  <!-- ============================================== -->
  <!-- 2. CENTRAL GOLD MEDALLION & GEAR BEZEL         -->
  <!-- ============================================== -->
  <g filter="url(#tileShadow)">
    <!-- Medallion Outer Bevel -->
    <circle cx="256" cy="226" r="178" fill="url(#goldRim)"/>
    <circle cx="256" cy="226" r="170" fill="#12141a" stroke="#78350f" stroke-width="2"/>
    <circle cx="256" cy="226" r="164" fill="url(#goldPlate)"/>

    <!-- Concentric Inner Recessed Slate Ring -->
    <circle cx="256" cy="226" r="148" fill="#0f1116" stroke="#fef08a" stroke-width="1.5"/>
    <circle cx="256" cy="226" r="144" fill="url(#bgGrad)"/>
  </g>

  <!-- Ambient Glow Behind Mug -->
  <circle cx="256" cy="225" r="98" fill="url(#warmAmberGlow)" class="ambient-glow"/>

  <!-- Circuitry Traces in Slate Ring -->
  <g opacity="0.5" stroke="#38bdf8" stroke-width="1.5" fill="none">
    <path d="M 130 226 L 168 226 L 186 208" stroke-dasharray="3 3"/>
    <circle cx="130" cy="226" r="2.5" fill="#38bdf8"/>
    <path d="M 382 226 L 344 226 L 326 244" stroke-dasharray="3 3"/>
    <circle cx="382" cy="226" r="2.5" fill="#38bdf8"/>
    <path d="M 256 100 L 256 126" stroke-dasharray="3 3"/>
    <circle cx="256" cy="100" r="2.5" fill="#38bdf8"/>
  </g>

  <!-- Arched Text: SIP & CODE -->
  <path id="archPath" d="M 136 194 A 134 134 0 0 1 376 194" fill="none"/>
  <text font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="23" fill="#fffbeb" letter-spacing="4.5" filter="url(#subtleGlow)">
    <textPath href="#archPath" startOffset="50%" text-anchor="middle">
      SIP &amp; CODE
    </textPath>
  </text>

  <!-- ============================================== -->
  <!-- 3. CENTER MOTIF: TACTILE COFFEE MUG + STEAM    -->
  <!-- ============================================== -->
  <g id="cupAndCode" transform="translate(256, 234)">
    <!-- HIGH-PROMINENCE LUMINOUS STEAM RIBBONS -->
    
    <!-- Left Curly Brace Steam Ribbon { -->
    <g class="steam-left steam-pulse">
      <!-- Glow Aura Path -->
      <path d="M -44 -74 C -36 -88, -26 -98, -38 -114 C -44 -122, -50 -126, -52 -134 C -48 -142, -36 -148, -32 -158 C -24 -172, -34 -186, -46 -196" 
            fill="none" stroke="url(#steamGlowGrad)" stroke-width="12" stroke-linecap="round" opacity="0.6" filter="url(#steamSuperGlow)"/>
      <!-- Crisp Foreground Neon Path -->
      <path d="M -44 -74 C -36 -88, -26 -98, -38 -114 C -44 -122, -50 -126, -52 -134 C -48 -142, -36 -148, -32 -158 C -24 -172, -34 -186, -46 -196" 
            fill="none" stroke="url(#luminousSteamGrad)" stroke-width="6.5" stroke-linecap="round" filter="url(#steamSuperGlow)"/>
      <!-- Inner Core Highlight -->
      <path d="M -44 -74 C -36 -88, -26 -98, -38 -114 C -44 -122, -50 -126, -52 -134 C -48 -142, -36 -148, -32 -158 C -24 -172, -34 -186, -46 -196" 
            fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.95"/>
    </g>
    
    <!-- Center Semicolon & Rising Sparkle Steam Ribbon ; -->
    <g class="steam-center steam-pulse">
      <!-- Glow Aura Path -->
      <circle cx="0" cy="-172" r="7" fill="#fde047" opacity="0.65" filter="url(#steamSuperGlow)"/>
      <path d="M 0 -158 C 4 -146, -2 -134, -5 -122 C -8 -110, 0 -98, 2 -86" 
            fill="none" stroke="url(#steamGlowGrad)" stroke-width="10" stroke-linecap="round" opacity="0.6" filter="url(#steamSuperGlow)"/>
      <!-- Crisp Foreground Core -->
      <circle cx="0" cy="-172" r="5" fill="#ffffff" stroke="#fde047" stroke-width="2" filter="url(#steamSuperGlow)"/>
      <path d="M 0 -158 C 4 -146, -2 -134, -5 -122 C -8 -110, 0 -98, 2 -86" 
            fill="none" stroke="url(#luminousSteamGrad)" stroke-width="5.5" stroke-linecap="round" filter="url(#steamSuperGlow)"/>
      <!-- Inner Core Highlight -->
      <path d="M 0 -158 C 4 -146, -2 -134, -5 -122 C -8 -110, 0 -98, 2 -86" 
            fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" opacity="0.95"/>
    </g>

    <!-- Right Curly Brace Steam Ribbon } -->
    <g class="steam-right steam-pulse">
      <!-- Glow Aura Path -->
      <path d="M 44 -74 C 36 -88, 26 -98, 38 -114 C 44 -122, 50 -126, 52 -134 C 48 -142, 36 -148, 32 -158 C 24 -172, 34 -186, 46 -196" 
            fill="none" stroke="url(#steamGlowGrad)" stroke-width="12" stroke-linecap="round" opacity="0.6" filter="url(#steamSuperGlow)"/>
      <!-- Crisp Foreground Neon Path -->
      <path d="M 44 -74 C 36 -88, 26 -98, 38 -114 C 44 -122, 50 -126, 52 -134 C 48 -142, 36 -148, 32 -158 C 24 -172, 34 -186, 46 -196" 
            fill="none" stroke="url(#luminousSteamGrad)" stroke-width="6.5" stroke-linecap="round" filter="url(#steamSuperGlow)"/>
      <!-- Inner Core Highlight -->
      <path d="M 44 -74 C 36 -88, 26 -98, 38 -114 C 44 -122, 50 -126, 52 -134 C 48 -142, 36 -148, 32 -158 C 24 -172, 34 -186, 46 -196" 
            fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.95"/>
    </g>

    <!-- Coffee Cup Saucer Plate Base -->
    <ellipse cx="0" cy="74" rx="78" ry="15" fill="#090a0d" stroke="url(#goldRim)" stroke-width="2.5" filter="url(#tileShadow)"/>
    <ellipse cx="0" cy="72" rx="68" ry="10.5" fill="#1e222b"/>

    <!-- Cup Handle (Right side) -->
    <path d="M 46 -18 C 90 -18, 90 48, 42 48" fill="none" stroke="url(#goldRim)" stroke-width="12" stroke-linecap="round" filter="url(#tileShadow)"/>
    <path d="M 46 -18 C 84 -18, 84 48, 42 48" fill="none" stroke="#15171e" stroke-width="6" stroke-linecap="round"/>

    <!-- Cup Body Outer -->
    <path d="M -54 -38 L -42 58 C -40 70, 40 70, 42 58 L 54 -38 Z" fill="url(#bgGrad)" stroke="url(#goldRim)" stroke-width="3.5" filter="url(#tileShadow)"/>

    <!-- Cup Rim & Coffee Surface -->
    <ellipse cx="0" cy="-38" rx="54" ry="16" fill="#14161c" stroke="url(#goldRim)" stroke-width="3"/>
    <ellipse cx="0" cy="-38" rx="48" ry="12.5" fill="url(#goldPlate)" opacity="0.35"/>
    <ellipse cx="0" cy="-37" rx="45" ry="10" fill="#2d1505"/>
    
    <!-- Latte Art Swirl in Coffee -->
    <ellipse cx="-4" cy="-37" rx="34" ry="7" fill="#542b0c" opacity="0.85"/>
    <path d="M -18 -37 C -8 -41, 10 -33, 20 -38" fill="none" stroke="#fde047" stroke-width="2" stroke-linecap="round" opacity="0.75"/>

    <!-- ============================================== -->
    <!-- NEON BLINKING OUTLINE SURROUNDING COFFEE CUP   -->
    <!-- ============================================== -->
    <g class="neon-cup-blink" filter="url(#neonCupGlowFilter)">
      <!-- Neon Saucer Base Outer Outline -->
      <ellipse cx="0" cy="74" rx="80" ry="16.5" fill="none" stroke="url(#neonCupGrad)" stroke-width="3" opacity="0.95"/>
      <ellipse cx="0" cy="74" rx="80" ry="16.5" fill="none" stroke="#ffffff" stroke-width="1.2" opacity="0.85"/>

      <!-- Neon Cup Handle Outer Arc -->
      <path d="M 46 -18 C 93 -18, 93 50, 42 50" fill="none" stroke="url(#neonCupGrad)" stroke-width="3.5" stroke-linecap="round"/>
      <path d="M 46 -18 C 93 -18, 93 50, 42 50" fill="none" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" opacity="0.85"/>

      <!-- Neon Cup Body Silhouette Outline -->
      <path d="M -56 -38 L -43 60 C -41 72, 41 72, 43 60 L 56 -38" fill="none" stroke="url(#neonCupGrad)" stroke-width="3.5" stroke-linecap="round"/>
      <path d="M -56 -38 L -43 60 C -41 72, 41 72, 43 60 L 56 -38" fill="none" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" opacity="0.85"/>

      <!-- Neon Cup Rim Outline -->
      <ellipse cx="0" cy="-38" rx="56" ry="17.5" fill="none" stroke="url(#neonCupGrad)" stroke-width="3"/>
      <ellipse cx="0" cy="-38" rx="56" ry="17.5" fill="none" stroke="#ffffff" stroke-width="1.2" opacity="0.85"/>
    </g>

    <!-- Cup Front Emblem Plate: Terminal Prompt >_ VAULT -->
    <rect x="-34" y="-10" width="68" height="44" rx="12" fill="#0d0e12" stroke="url(#goldRim)" stroke-width="1.8" filter="url(#subtleGlow)"/>
    <text x="-8" y="11" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-weight="900" font-size="17" fill="#38bdf8" text-anchor="middle" filter="url(#glowFilter)">&gt;</text>
    <text x="8" y="11" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-weight="900" font-size="17" fill="#38bdf8" text-anchor="middle" class="cursor-blink" filter="url(#glowFilter)">_</text>
    <text x="0" y="27" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="9" fill="#fde047" text-anchor="middle" letter-spacing="1.5">VAULT</text>
  </g>

  <!-- ============================================== -->
  <!-- 4. BOTTOM BADGES & METALLIC RIBBON             -->
  <!-- ============================================== -->
  <g transform="translate(256, 416)" filter="url(#tileShadow)">
    <!-- Gold Medallion Ribbon Banner -->
    <rect x="-160" y="-17" width="320" height="34" rx="17" fill="url(#goldRim)" stroke="#582900" stroke-width="2"/>
    <rect x="-155" y="-13" width="310" height="26" rx="13" fill="#0f1116" stroke="#facc15" stroke-width="1.2"/>
    <text y="5" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="11" fill="#fffbeb" text-anchor="middle" letter-spacing="2.8" filter="url(#subtleGlow)">
      PROMPT VAULT STUDIO
    </text>
  </g>

  <!-- Bottom Accent Edition Pill -->
  <g transform="translate(256, 458)">
    <rect x="-68" y="-10" width="136" height="20" rx="10" fill="#0d0e12" stroke="url(#cyberGrad)" stroke-width="1.5"/>
    <text y="4" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="bold" font-size="8.5" fill="#38bdf8" text-anchor="middle" letter-spacing="1.8">
      ANDROID • CLI
    </text>
  </g>
</svg>
