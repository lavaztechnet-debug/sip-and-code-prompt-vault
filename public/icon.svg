<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#2c3038"/>
      <stop offset="60%" stop-color="#181a1f"/>
      <stop offset="100%" stop-color="#0e1013"/>
    </radialGradient>

    <!-- Metallic Gold Outer Rim -->
    <linearGradient id="goldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff8d6"/>
      <stop offset="15%" stop-color="#f5d061"/>
      <stop offset="35%" stop-color="#a67c1e"/>
      <stop offset="50%" stop-color="#fff4c2"/>
      <stop offset="70%" stop-color="#d4aa43"/>
      <stop offset="85%" stop-color="#7a5312"/>
      <stop offset="100%" stop-color="#e8c263"/>
    </linearGradient>

    <!-- Metallic Gold Inner Plate -->
    <radialGradient id="goldPlate" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffeaa5"/>
      <stop offset="40%" stop-color="#d8aa42"/>
      <stop offset="80%" stop-color="#916416"/>
      <stop offset="100%" stop-color="#543708"/>
    </radialGradient>

    <!-- Cyan to Violet Cyber Glow -->
    <linearGradient id="cyberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38f9d7"/>
      <stop offset="50%" stop-color="#4facfe"/>
      <stop offset="100%" stop-color="#f093fb"/>
    </linearGradient>

    <!-- Amber Glow Gradient -->
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="tileShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000000" flood-opacity="0.65"/>
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>

    <filter id="glowFilter" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="embossFilter" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="1" dy="2" stdDeviation="1" flood-color="#000000" flood-opacity="0.8"/>
      <feDropShadow dx="-1" dy="-1" stdDeviation="1" flood-color="#fff8d6" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- App Icon Base Squircle Tile -->
  <rect x="16" y="16" width="480" height="480" rx="104" fill="url(#bgGrad)" filter="url(#tileShadow)"/>
  <rect x="18" y="18" width="476" height="476" rx="102" fill="none" stroke="url(#goldRim)" stroke-width="3" opacity="0.6"/>

  <!-- Subtle Brushed Inner Border -->
  <rect x="28" y="28" width="456" height="456" rx="94" fill="none" stroke="#373e4b" stroke-width="1.5" opacity="0.5"/>

  <!-- Golden Central Medallion Outer Bezel -->
  <circle cx="256" cy="236" r="182" fill="url(#goldRim)" filter="url(#tileShadow)"/>
  <circle cx="256" cy="236" r="172" fill="#15171c" stroke="#4a350b" stroke-width="2"/>
  <circle cx="256" cy="236" r="168" fill="url(#goldPlate)"/>

  <!-- Recessed Dark Slate Inner Core -->
  <circle cx="256" cy="236" r="154" fill="#121418" stroke="#ffeaa5" stroke-width="2"/>
  <circle cx="256" cy="236" r="150" fill="url(#bgGrad)"/>

  <!-- Subtle Circuitry Trace Lines in Background -->
  <path d="M 130 236 L 180 236 L 200 216 M 382 236 L 332 236 L 312 256 M 256 110 L 256 145" fill="none" stroke="#38f9d7" stroke-width="2" opacity="0.25" stroke-dasharray="4 4"/>
  <circle cx="130" cy="236" r="3" fill="#38f9d7" opacity="0.4"/>
  <circle cx="382" cy="236" r="3" fill="#38f9d7" opacity="0.4"/>

  <!-- Top Arched Text: SIP & CODE -->
  <path id="archPath" d="M 140 200 A 136 136 0 0 1 372 200" fill="none"/>
  <text font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="25" fill="#fff5cc" filter="url(#embossFilter)" letter-spacing="4">
    <textPath href="#archPath" startOffset="50%" text-anchor="middle">
      SIP &amp; CODE
    </textPath>
  </text>

  <!-- ============================================== -->
  <!-- CENTER MOTIF: ICONIC TACTILE COFFEE MUG + CODE -->
  <!-- ============================================== -->
  <g id="cupAndCode" transform="translate(256, 245)">
    <!-- Steam Lines forming Curly Braces { ; } -->
    <!-- Left Curly Brace Steam { -->
    <path d="M -42 -75 C -34 -85, -28 -95, -36 -108 C -40 -115, -45 -118, -48 -124 C -45 -130, -38 -135, -34 -142 C -28 -152, -35 -162, -44 -170" fill="none" stroke="url(#cyberGrad)" stroke-width="4" stroke-linecap="round" filter="url(#glowFilter)" opacity="0.9"/>
    
    <!-- Center Semicolon / Sparkle Steam ; -->
    <ellipse cx="0" cy="-148" rx="3.5" ry="3.5" fill="#fbbf24" filter="url(#glowFilter)"/>
    <path d="M 0 -138 C 2 -130, -1 -122, -4 -115" fill="none" stroke="#fbbf24" stroke-width="3" stroke-linecap="round" filter="url(#glowFilter)"/>

    <!-- Right Curly Brace Steam } -->
    <path d="M 42 -75 C 34 -85, 28 -95, 36 -108 C 40 -115, 45 -118, 48 -124 C 45 -130, 38 -135, 34 -142 C 28 -152, 35 -162, 44 -170" fill="none" stroke="url(#cyberGrad)" stroke-width="4" stroke-linecap="round" filter="url(#glowFilter)" opacity="0.9"/>

    <!-- Coffee Cup Saucer Plate Base -->
    <ellipse cx="0" cy="72" rx="76" ry="14" fill="#0d0f12" stroke="url(#goldRim)" stroke-width="2.5" filter="url(#tileShadow)"/>
    <ellipse cx="0" cy="70" rx="66" ry="10" fill="#20242c"/>

    <!-- Cup Handle (Right side) -->
    <path d="M 46 -20 C 85 -20, 85 45, 42 45" fill="none" stroke="url(#goldRim)" stroke-width="12" stroke-linecap="round" filter="url(#tileShadow)"/>
    <path d="M 46 -20 C 80 -20, 80 45, 42 45" fill="none" stroke="#1c1f26" stroke-width="6" stroke-linecap="round"/>

    <!-- Cup Body Outer -->
    <path d="M -54 -40 L -42 56 C -40 68, 40 68, 42 56 L 54 -40 Z" fill="url(#bgGrad)" stroke="url(#goldRim)" stroke-width="3.5" filter="url(#tileShadow)"/>

    <!-- Cup Rim & Coffee Surface -->
    <ellipse cx="0" cy="-40" rx="54" ry="16" fill="#181a1f" stroke="url(#goldRim)" stroke-width="3"/>
    <ellipse cx="0" cy="-40" rx="48" ry="12" fill="url(#goldPlate)" opacity="0.3"/>
    <ellipse cx="0" cy="-39" rx="46" ry="10" fill="#3a1e08"/>
    <!-- Coffee Surface Swirl / Cream Art -->
    <ellipse cx="-4" cy="-39" rx="34" ry="7" fill="#663a14" opacity="0.8"/>
    <path d="M -18 -39 C -10 -43, 10 -35, 20 -40" fill="none" stroke="#d4aa43" stroke-width="2" stroke-linecap="round" opacity="0.6"/>

    <!-- Cup Emblem Plate (Center of Cup) -->
    <rect x="-32" y="-12" width="64" height="42" rx="10" fill="#111317" stroke="url(#goldRim)" stroke-width="1.5"/>
    <text x="0" y="8" font-family="monospace, ui-monospace, sans-serif" font-weight="900" font-size="16" fill="#38f9d7" text-anchor="middle" filter="url(#glowFilter)">&gt;_</text>
    <text x="0" y="24" font-family="system-ui, sans-serif" font-weight="900" font-size="9" fill="#f5d061" text-anchor="middle" letter-spacing="1">VAULT</text>
  </g>

  <!-- ============================================== -->
  <!-- BOTTOM BADGE: DEVELOPER LIFESTYLE & EDITION -->
  <!-- ============================================== -->
  <g transform="translate(256, 422)" filter="url(#tileShadow)">
    <!-- Gold Medallion Ribbon Banner -->
    <rect x="-160" y="-18" width="320" height="36" rx="18" fill="url(#goldRim)" stroke="#4a350b" stroke-width="2"/>
    <rect x="-156" y="-14" width="312" height="28" rx="14" fill="#14171d" stroke="#f5d061" stroke-width="1"/>
    <text y="5" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="11" fill="#fff8d6" text-anchor="middle" letter-spacing="2.5" filter="url(#embossFilter)">
      PROMPT VAULT STUDIO
    </text>
  </g>

  <!-- Bottom Accent Edition Pill -->
  <g transform="translate(256, 464)">
    <rect x="-65" y="-10" width="130" height="20" rx="10" fill="#111317" stroke="url(#cyberGrad)" stroke-width="1.5"/>
    <text y="4" font-family="monospace, ui-monospace, sans-serif" font-weight="bold" font-size="8.5" fill="#38f9d7" text-anchor="middle" letter-spacing="1.5">
      SAMSUNG • S24+
    </text>
  </g>
</svg>
