name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

jobs:
  build-apk:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK (Temurin 21)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install NPM Dependencies & Capacitor
        run: |
          npm install --legacy-peer-deps
          npm install @capacitor/core @capacitor/cli @capacitor/android --legacy-peer-deps

      - name: Build Web Production Bundle
        run: npm run build

      - name: Initialize & Sync Capacitor Android
        run: |
          npx cap add android || true
          npx cap sync android
          
          # Fix duplicate Kotlin stdlib-jdk7 / stdlib-jdk8 classes in Gradle
          if [ -f "android/app/build.gradle" ]; then
            echo "" >> android/app/build.gradle
            echo "configurations.all {" >> android/app/build.gradle
            echo "    resolutionStrategy {" >> android/app/build.gradle
            echo "        capabilitiesResolution.withCapability(\"org.jetbrains.kotlin:kotlin-stdlib-jdk7\") { select(\"org.jetbrains.kotlin:kotlin-stdlib:1.8.22\") }" >> android/app/build.gradle
            echo "        capabilitiesResolution.withCapability(\"org.jetbrains.kotlin:kotlin-stdlib-jdk8\") { select(\"org.jetbrains.kotlin:kotlin-stdlib:1.8.22\") }" >> android/app/build.gradle
            echo "    }" >> android/app/build.gradle
            echo "    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'" >> android/app/build.gradle
            echo "    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'" >> android/app/build.gradle
            echo "}" >> android/app/build.gradle
          fi

      - name: Grant Execute Permission for Gradle Wrapper
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sip-and-code-vault-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
